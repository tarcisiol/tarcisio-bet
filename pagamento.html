<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarcisio BET - Pagamento</title>
    
    <!-- ÍCONE DA ABA DO NAVEGADOR -->
    <link rel="icon" type="image/png" href="navegador.png">
    
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            background-color: #000000 !important;
            color: #ffffff !important;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px 0;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 15px;
            padding: 0 10px;
        }

        .logo-container img {
            max-width: 220px;
            width: 100%;
            height: auto;
        }

        .menu-navegacao {
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            padding: 0 10px;
        }

        .btn-inicio {
            color: #ffffff !important;
            text-decoration: none;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 5px;
            transition: 0.2s;
            font-size: 16px;
        }

        .btn-inicio:hover {
            color: #00ff00 !important;
            background-color: #111111 !important;
        }

        .caixa-pagamento {
            background-color: #0a0a0a;
            border: 1px solid #00ff00;
            border-radius: 12px;
            padding: 30px 20px;
            max-width: 520px;
            width: 92%;
            margin: 25px auto;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.15);
        }

        .caixa-pagamento h1 {
            margin-top: 0;
            color: #00ff00 !important;
            text-transform: uppercase;
            font-size: 22px;
            margin-bottom: 15px;
        }

        .subtitulo-secao {
            font-size: 14px;
            color: #aaaaaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 15px 0 10px 0;
            text-align: left;
        }

        .grid-valores {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-valor {
            background-color: #121212;
            border: 1px solid #333333;
            color: #ffffff;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-valor:hover, .btn-valor.ativo {
            border-color: #00ff00;
            background-color: #003300;
            color: #00ff00;
        }

        .campo-customizado {
            display: flex;
            align-items: center;
            background-color: #121212;
            border: 1px solid #333333;
            border-radius: 6px;
            padding: 0 12px;
            margin-bottom: 20px;
        }

        .simbolo-moeda {
            color: #00ff00;
            font-weight: bold;
            margin-right: 8px;
        }

        .campo-customizado input {
            border: none;
            background: transparent;
            padding: 12px 0;
            color: #ffffff;
            width: 100%;
            outline: none;
            font-size: 15px;
        }

        .info-api {
            background-color: #121212;
            border-left: 4px solid #00ff00;
            padding: 12px;
            font-size: 13px;
            color: #cccccc;
            text-align: left;
            margin-bottom: 20px;
            border-radius: 0 6px 6px 0;
        }

        .btn-acao {
            width: 100%;
            background-color: #00ff00 !important;
            color: #000000 !important;
            border: none !important;
            padding: 15px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn-acao:hover {
            background-color: #00cc00 !important;
            box-shadow: 0 0 12px rgba(0, 255, 0, 0.4);
        }

        .btn-voltar {
            display: inline-block;
            width: 100%;
            background-color: transparent;
            color: #aaaaaa;
            text-decoration: none;
            padding: 10px;
            font-size: 14px;
            margin-top: 15px;
            transition: 0.2s;
        }

        .btn-voltar:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <a href="index.html"><img src="logo da bet.png" alt="Logo Tarcisio BET"></a>
        </div>
        
        <nav class="menu-navegacao">
            <a class="btn-inicio" href="index.html">Página Principal</a>
            <a class="btn-inicio" href="jogos.html">Jogos</a>
            <a class="btn-inicio" href="suporte.html">Suporte</a>
        </nav>
    </header>
    
    <main>
        <div class="caixa-pagamento">
            <h1>Área de Depósito</h1>

            <!-- SELEÇÃO DE VALOR -->
            <div class="subtitulo-secao">1. Selecione o Valor</div>
            <div class="grid-valores">
                <button type="button" class="btn-valor" onclick="selecionarValor(20, this)">R$ 20</button>
                <button type="button" class="btn-valor ativo" onclick="selecionarValor(50, this)">R$ 50</button>
                <button type="button" class="btn-valor" onclick="selecionarValor(100, this)">R$ 100</button>
            </div>

            <div class="campo-customizado">
                <span class="simbolo-moeda">R$</span>
                <input type="number" id="valor_deposito" value="50" min="5" placeholder="Outro valor (Mínimo R$ 5)">
            </div>

            <div class="info-api">
                💳 Ao clicar em pagar, você será redirecionado para o ambiente seguro do <b>Mercado Pago</b> (PIX, Cartão e Boleto).
            </div>

            <button class="btn-acao" onclick="iniciarPagamentoMercadoPago()">Continuar para Pagamento</button>

            <a href="index.html" class="btn-voltar">Voltar para a Página Principal</a>
        </div>
    </main>

    <script>
        function selecionarValor(valor, elemento) {
            document.getElementById('valor_deposito').value = valor;
            const botoes = document.querySelectorAll('.btn-valor');
            botoes.forEach(btn => btn.classList.remove('ativo'));
            elemento.classList.add('ativo');
        }

        document.getElementById('valor_deposito').addEventListener('input', () => {
            const botoes = document.querySelectorAll('.btn-valor');
            botoes.forEach(btn => btn.classList.remove('ativo'));
        });

        async function iniciarPagamentoMercadoPago() {
            const valor = parseFloat(document.getElementById('valor_deposito').value);
            
            if (!valor || valor < 5) {
                alert("O valor mínimo para depósito é R$ 5,00");
                return;
            }

            try {
                // Requisição para o seu servidor back-end que criará a preferência de pagamento no Mercado Pago
                const resposta = await fetch('http://localhost:3000/api/criar-preferencia', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        items: [
                            {
                                title: 'Depósito Tarcisio BET',
                                quantity: 1,
                                unit_price: valor
                            }
                        ]
                    })
                });

                const dados = await resposta.json();

                if (dados.init_point) {
                    // Redireciona o usuário para o checkout oficial do Mercado Pago
                    window.location.href = dados.init_point;
                } else {
                    alert("Erro ao gerar o pagamento. Tente novamente mais tarde.");
                }
            } catch (erro) {
                console.error("Erro na comunicação com o servidor:", erro);
                alert("Não foi possível conectar ao servidor de pagamentos. Verifique se o back-end está rodando.");
            }
        }
    </script>

</body>
</html>
