<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarcisio BET - Suporte</title>
    
    <link rel="icon" type="image/png" href="navegador.png">

    <link rel="stylesheet" href="style.css">
    <style>
        /* RESET E COR DO FUNDO DA PÁGINA TOTALMENTE PRETO */
        * {
            box-sizing: border-box;
        }

        html, body {
            background-color: #000000 !important;
            color: #ffffff !important;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px 0;
        }

        /* Centraliza a logo no topo */
        .logo-container {
            text-align: center;
            margin-bottom: 15px;
            padding: 0 10px;
        }

        .logo-container img {
            max-width: 250px;
            width: 100%;
            height: auto;
        }

        /* Centraliza a navegação logo abaixo da logo */
        .menu-navegacao {
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap; /* Permite quebrar linha em telas menores */
            padding: 0 10px;
        }

        .btn-inicio {
            color: #ffffff !important;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            padding: 8px 16px;
            border-radius: 5px;
            transition: 0.2s;
        }

        .btn-inicio:hover {
            color: #00ff00 !important;
            background-color: #111111 !important;
        }

        hr {
            border: 0;
            height: 1px;
            background: #222222 !important;
            margin: 25px 0;
        }

        /* CONTAINER DA CAIXA DE SUPORTE */
        .suporte-container {
            background-color: #0a0a0a !important;
            border: 1px solid #00ff00 !important;
            border-radius: 12px;
            padding: 30px;
            width: 92%;
            max-width: 580px;
            margin: 30px auto;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.15);
            text-align: center;
        }

        .suporte-container h1 {
            color: #00ff00 !important;
            text-transform: uppercase;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .suporte-container h4 {
            color: #cccccc !important;
            font-size: 15px;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: normal;
        }

        /* ESTILIZAÇÃO DA CAIXA DE TEXTO (TEXTAREA) */
        textarea {
            width: 100%;
            background-color: #121212 !important;
            color: #ffffff !important;
            border: 1px solid #333333 !important;
            border-radius: 6px;
            padding: 14px;
            font-size: 15px;
            font-family: Arial, sans-serif;
            outline: none;
            resize: vertical;
            min-height: 180px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea::placeholder {
            color: #666666 !important;
        }

        textarea:focus {
            border-color: #00ff00 !important;
            box-shadow: 0 0 8px rgba(0, 255, 0, 0.4);
        }

        /* BOTÃO ENVIAR MENSAGEM */
        .btn-principal {
            width: 100%;
            background-color: #00ff00 !important;
            color: #000000 !important;
            border: none !important;
            padding: 15px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 20px;
            box-shadow: 0 0 12px rgba(0, 255, 0, 0.4);
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
        }

        .btn-principal:hover {
            background-color: #00cc00 !important;
            transform: scale(1.01);
            box-shadow: 0 0 18px rgba(0, 255, 0, 0.7);
        }

        /* LINK VOLTAR */
        .link-suporte {
            display: inline-block;
            margin-top: 20px;
            color: #00ff00 !important;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: opacity 0.2s;
        }

        .link-suporte:hover {
            text-decoration: underline;
            opacity: 0.8;
        }

        /* REGRAS PARA CELULARES */
        @media (max-width: 480px) {
            .suporte-container {
                padding: 20px 15px;
            }

            .suporte-container h1 {
                font-size: 20px;
            }

            .btn-inicio {
                font-size: 14px;
                padding: 6px 10px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <a href="pag principal.html">
                <img src="logo da bet.png" alt="Logo Tarcisio BET">
            </a>
        </div>
        
        <nav class="menu-navegacao">
            <a class="btn-inicio" href="pag principal.html">Início</a>
            <a class="btn-inicio" href="forms.html">Cadastre-se</a>
            <a class="btn-inicio" href="suporte.html">Suporte</a>
        </nav>
    </header>
    
    <hr>
    
    <main>
        <div class="suporte-container">
            <h1>Suporte ao Cliente</h1>
            <h4>Como podemos te ajudar? Deixe sua mensagem abaixo:</h4>
            
            <form action="#" method="POST">
                <textarea placeholder="Digite sua mensagem para a nossa equipe de suporte..." rows="8" required></textarea>

                <button type="submit" class="btn-principal">Enviar Mensagem</button>
            </form>

            <a class="link-suporte" href="forms.html">← Voltar para o cadastro</a>
        </div>
    </main>

</body>
</html>
